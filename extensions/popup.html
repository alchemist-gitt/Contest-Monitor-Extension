<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 12px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }
    .subtitle {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .section {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
    }
    input {
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #3b82f6;
    }
    .user-info {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
    }
    .stat-card.alert {
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      color: #ef4444;
    }
    .stat-card.ok {
      background-color: #f0fdf4;
      border: 1px solid #dcfce7;
      color: #22c55e;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }
    .log-container {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fafafa;
      font-family: monospace;
      font-size: 11px;
      padding: 4px;
      margin-bottom: 12px;
    }
    .log-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 6px;
      border-bottom: 1px dashed #f1f5f9;
    }
    .log-row:last-child {
      border-bottom: none;
    }
    .log-type.alert {
      color: #ef4444;
      font-weight: bold;
    }
    .log-type.ok {
      color: #22c55e;
    }
    .log-time {
      color: #64748b;
    }
    .btn {
      width: 100%;
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn:hover {
      background-color: #2563eb;
    }
    .btn-secondary {
      background-color: #e2e8f0;
      color: #475569;
      margin-top: 4px;
    }
    .btn-secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>
  <h2>Contest Monitor</h2>
  <div class="subtitle">Stage 1 · Local Log with User ID</div>

  <!-- User Identification Section -->
  <div class="section">
    <div class="form-group">
      <label for="username">Participant Name / Handle</label>
      <input type="text" id="username" placeholder="e.g. CodeforcesHandle">
      <div class="user-info">
        <span>ID: <span id="userIdDisplay" style="font-family:monospace;">Generating...</span></span>
        <span id="saveStatus" style="color:#22c55e; font-weight:600; display:none;">Saved!</span>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card alert">
      <div>Focus Lost</div>
      <div id="alertCount" class="stat-val">0</div>
    </div>
    <div class="stat-card ok">
      <div>Focus Active</div>
      <div id="okCount" class="stat-val">0</div>
    </div>
  </div>

  <div class="log-container" id="log">
    <div style="text-align: center; color: #94a3b8; padding: 12px;">
      No events yet — switch tabs or Alt+Tab on the test page.
    </div>
  </div>

  <button id="clear" class="btn btn-secondary">Clear Log</button>

  <script src="popup.js"></script>
</body>
</html>
